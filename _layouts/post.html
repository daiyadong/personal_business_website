---
layout: default
---

<!-- Structured Data: BlogPosting -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title | escape }}",
  "description": "{{ page.description | escape }}",
  "datePublished": "{{ page.date | date: '%Y-%m-%d' }}",
  "dateModified": "{{ page.date | date: '%Y-%m-%d' }}",
  "author": {
    "@type": "Person",
    "name": "MarsX",
    "url": "{{ site.url }}/"
  },
  "publisher": {
    "@type": "ProfessionalService",
    "name": "MarsX",
    "url": "{{ site.url }}/"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ site.url }}{{ page.url }}"
  }
}
</script>

<!-- Structured Data: BreadcrumbList -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "MarsX",
      "item": "{{ site.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "技术博客",
      "item": "{{ site.url }}/blog/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ page.title | escape }}",
      "item": "{{ site.url }}{{ page.url }}"
    }
  ]
}
</script>

<article class="blog-post section">
    <div class="container">
        <header class="blog-post__header">
            <h1 class="blog-post__title">{{ page.title }}</h1>
            <div class="blog-post__meta">
                <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%Y-%m-%d" }}</time>
                {% if page.categories %}
                <span class="blog-post__categories">
                    {% for category in page.categories %}
                    <span class="blog-post__category">{{ category }}</span>
                    {% endfor %}
                </span>
                {% endif %}
            </div>
        </header>
        <div class="blog-post__content">
            {{ content }}
        </div>
        <footer class="blog-post__footer">
            <a href="/blog/" class="btn btn--outline">&larr; 返回博客列表</a>
        </footer>
    </div>
</article>
