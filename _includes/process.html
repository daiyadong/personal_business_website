<!-- ========== 服务流程 ========== -->
<section class="process section" id="process">
    <div class="container">
        <div class="section__header">
            <h2 class="section__title" data-i18n="process.title">服务流程</h2>
            <p class="section__subtitle" data-i18n="process.subtitle">系统化方法论，确保每个环节可落地、可验证</p>
        </div>
        <div class="process__steps">
            <div class="process__step reveal">
                <div class="process__step-number">01</div>
                <div class="process__step-content">
                    <h3 data-i18n="process.step1.title">需求沟通</h3>
                    <p data-i18n="process.step1.desc">了解业务场景与产品形态，梳理安全需求、合规要求与目标范围，明确项目边界与交付标准。</p>
                </div>
            </div>
            <div class="process__step reveal">
                <div class="process__step-number">02</div>
                <div class="process__step-content">
                    <h3 data-i18n="process.step2.title">差距分析</h3>
                    <p data-i18n="process.step2.desc">对现有系统架构、开发流程、安全控制措施进行全面评估，识别安全薄弱环节与合规差距。</p>
                </div>
            </div>
            <div class="process__step reveal">
                <div class="process__step-number">03</div>
                <div class="process__step-content">
                    <h3 data-i18n="process.step3.title">方案设计</h3>
                    <p data-i18n="process.step3.desc">定制化安全架构方案与落地路线图，输出威胁模型、安全规范、技术选型与实施计划。</p>
                </div>
            </div>
            <div class="process__step reveal">
                <div class="process__step-number">04</div>
                <div class="process__step-content">
                    <h3 data-i18n="process.step4.title">落地实施</h3>
                    <p data-i18n="process.step4.desc">SDL 流程嵌入研发体系，安全编码规范落地，自动化安全测试集成，团队安全能力赋能培训。</p>
                </div>
            </div>
            <div class="process__step reveal">
                <div class="process__step-number">05</div>
                <div class="process__step-content">
                    <h3 data-i18n="process.step5.title">持续运营</h3>
                    <p data-i18n="process.step5.desc">定期安全复评与渗透测试，安全监控与应急响应体系优化，合规跟踪与持续改进迭代。</p>
                </div>
            </div>
        </div>
    </div>
</section>
