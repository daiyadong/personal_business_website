<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Brand gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060e1a"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1d33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="accentDim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#004d33"/>
      <stop offset="50%" stop-color="#003d44"/>
      <stop offset="100%" stop-color="#003355"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- ===== Grid & Matrix Patterns ===== -->

  <!-- Main grid (structural) -->
  <g opacity="0.04" stroke="#00d4aa" stroke-width="0.5">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Dense dot grid (PCB-style) -->
  <g fill="#00ff41" opacity="0.06">
    <!-- Row 1 -->
    <circle cx="50" cy="30" r="1.2"/><circle cx="100" cy="30" r="1.2"/><circle cx="150" cy="30" r="1.2"/><circle cx="200" cy="30" r="1.2"/><circle cx="250" cy="30" r="1.2"/>
    <circle cx="350" cy="30" r="1.2"/><circle cx="400" cy="30" r="1.2"/><circle cx="450" cy="30" r="1.2"/><circle cx="500" cy="30" r="1.2"/><circle cx="550" cy="30" r="1.2"/>
    <circle cx="650" cy="30" r="1.2"/><circle cx="700" cy="30" r="1.2"/><circle cx="750" cy="30" r="1.2"/><circle cx="800" cy="30" r="1.2"/><circle cx="850" cy="30" r="1.2"/>
    <circle cx="950" cy="30" r="1.2"/><circle cx="1000" cy="30" r="1.2"/><circle cx="1050" cy="30" r="1.2"/><circle cx="1100" cy="30" r="1.2"/><circle cx="1150" cy="30" r="1.2"/>
    <!-- Row 2 -->
    <circle cx="80" cy="60" r="1.2"/><circle cx="180" cy="60" r="1.2"/><circle cx="280" cy="60" r="1.2"/><circle cx="380" cy="60" r="1.2"/><circle cx="480" cy="60" r="1.2"/>
    <circle cx="580" cy="60" r="1.2"/><circle cx="680" cy="60" r="1.2"/><circle cx="780" cy="60" r="1.2"/><circle cx="880" cy="60" r="1.2"/><circle cx="980" cy="60" r="1.2"/><circle cx="1080" cy="60" r="1.2"/>
    <!-- More rows scattered -->
    <circle cx="30" cy="90" r="1.2"/><circle cx="130" cy="90" r="1.2"/><circle cx="230" cy="90" r="1.2"/><circle cx="330" cy="90" r="1.2"/><circle cx="430" cy="90" r="1.2"/>
    <circle cx="530" cy="90" r="1.2"/><circle cx="630" cy="90" r="1.2"/><circle cx="730" cy="90" r="1.2"/><circle cx="830" cy="90" r="1.2"/><circle cx="930" cy="90" r="1.2"/><circle cx="1030" cy="90" r="1.2"/>
    <circle cx="60" cy="120" r="1.2"/><circle cx="160" cy="120" r="1.2"/><circle cx="260" cy="120" r="1.2"/><circle cx="360" cy="120" r="1.2"/><circle cx="460" cy="120" r="1.2"/>
    <circle cx="560" cy="120" r="1.2"/><circle cx="660" cy="120" r="1.2"/><circle cx="760" cy="120" r="1.2"/><circle cx="860" cy="120" r="1.2"/><circle cx="960" cy="120" r="1.2"/><circle cx="1060" cy="120" r="1.2"/>
    <circle cx="90" cy="150" r="1.2"/><circle cx="190" cy="150" r="1.2"/><circle cx="290" cy="150" r="1.2"/><circle cx="390" cy="150" r="1.2"/><circle cx="490" cy="150" r="1.2"/>
    <circle cx="590" cy="150" r="1.2"/><circle cx="690" cy="150" r="1.2"/><circle cx="790" cy="150" r="1.2"/><circle cx="890" cy="150" r="1.2"/><circle cx="990" cy="150" r="1.2"/><circle cx="1090" cy="150" r="1.2"/>
  </g>

  <!-- ===== Decorative Hexagonal Circuit Board Elements ===== -->

  <!-- Left side: large hexagon circuit node -->
  <g opacity="0.08" stroke="#00d4aa" stroke-width="1" fill="none" transform="translate(120,260)">
    <polygon points="0,-55 48,-28 48,28 0,55 -48,28 -48,-28"/>
    <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12"/>
    <line x1="0" y1="-55" x2="0" y2="-90"/>
    <line x1="48" y1="28" x2="80" y2="50"/>
    <line x1="-48" y1="-28" x2="-80" y2="-50"/>
    <circle cx="0" cy="-55" r="3" fill="#00d4aa"/>
    <circle cx="48" cy="28" r="3" fill="#00d4aa"/>
    <circle cx="-48" cy="-28" r="3" fill="#00d4aa"/>
    <circle cx="0" cy="55" r="3" fill="#00d4aa"/>
    <circle cx="-48" cy="28" r="3" fill="#00d4aa"/>
    <circle cx="48" cy="-28" r="3" fill="#00d4aa"/>
  </g>

  <!-- Right side: circuit traces -->
  <g opacity="0.06" stroke="#00ff41" stroke-width="1.2" fill="none" transform="translate(1020,200)">
    <polyline points="-50,-30 -20,-30 0,-10 20,-10 40,-30"/>
    <polyline points="-50,0 -10,0 10,20 40,20"/>
    <polyline points="-50,30 -30,30 -10,10 0,10 20,30"/>
    <circle cx="-50" cy="-30" r="2.5" fill="#00ff41"/>
    <circle cx="-50" cy="0" r="2.5" fill="#00ff41"/>
    <circle cx="-50" cy="30" r="2.5" fill="#00ff41"/>
    <circle cx="40" cy="-30" r="2.5" fill="#00ff41"/>
    <circle cx="40" cy="20" r="2.5" fill="#00ff41"/>
    <circle cx="20" cy="30" r="2.5" fill="#00ff41"/>
  </g>

  <!-- ===== Center: Logo Mark ===== -->

  <!-- Large hexagonal shield -->
  <g transform="translate(600,195)">
    <polygon points="0,-85 76,-40 76,40 0,85 -76,40 -76,-40" fill="none" stroke="url(#accentDim)" stroke-width="2" opacity="0.4"/>
    <polygon points="0,-70 63,-33 63,33 0,70 -63,33 -63,-33" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>

    <!-- Inner: Terminal cursor block -->
    <!-- Big > bracket -->
    <polyline points="-28,-22 8,0 -28,22" fill="none" stroke="url(#neon)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Underscore / blinking cursor -->
    <rect x="12" y="15" width="22" height="5" rx="2.5" fill="url(#neon)" filter="url(#glowStrong)"/>
  </g>

  <!-- ===== Brand Name ===== -->

  <!-- "M" with subtle glitch offset shadow -->
  <text x="600" y="390" text-anchor="middle" font-family="'Courier New','Source Code Pro','SF Mono',monospace" font-size="76" font-weight="900" fill="url(#accent)" filter="url(#glow)" letter-spacing="6">
    MarsX
  </text>

  <!-- Glitch offset layer -->
  <text x="597" y="388" text-anchor="middle" font-family="'Courier New','Source Code Pro','SF Mono',monospace" font-size="76" font-weight="900" fill="#00ff41" opacity="0.15" letter-spacing="6">
    MarsX
  </text>

  <!-- ===== Tagline (terminal-style) ===== -->

  <!-- Terminal prompt decorator -->
  <text x="490" y="450" font-family="'Courier New',monospace" font-size="16" fill="#00ff41" opacity="0.4">root@marsx:~$</text>
  <rect x="615" y="444" width="8" height="12" fill="#00ff41" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0;0.3" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle -->
  <text x="600" y="470" text-anchor="middle" font-family="'Noto Sans SC','Inter',sans-serif" font-size="20" fill="#64748b" letter-spacing="4">
    全链路安全方案咨询
  </text>

  <text x="600" y="498" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#475569" letter-spacing="2">
    PRODUCT SECURITY · SDL · DEVSECOPS · COMPLIANCE
  </text>

  <!-- ===== Bottom accent elements ===== -->

  <!-- Scan line -->
  <rect x="460" y="530" width="280" height="1" fill="url(#accent)" opacity="0.3"/>

  <!-- Binary decoration -->
  <text x="600" y="555" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#00ff41" opacity="0.15" letter-spacing="1">
    01101101 01100001 01110010 01110011 01111000
  </text>

  <!-- Corner accents: small hexagons -->
  <g opacity="0.15" stroke="url(#accent)" stroke-width="1" fill="none">
    <polygon points="30,20 50,30 50,50 30,60 10,50 10,30"/>
    <polygon points="1170,20 1190,30 1190,50 1170,60 1150,50 1150,30"/>
    <polygon points="30,570 50,580 50,600 30,610 10,600 10,580"/>
    <polygon points="1170,570 1190,580 1190,600 1170,610 1150,600 1150,580"/>
  </g>
</svg>
