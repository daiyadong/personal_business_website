<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circuit board hexagonal track -->
  <g opacity="0.5" stroke="url(#brand)" stroke-width="0.8" fill="none">
    <!-- Hexagon border (angular tech shield) -->
    <polygon points="24,3 41,12 41,33 24,45 7,33 7,12" stroke-width="1.2"/>
    <!-- Inner track lines -->
    <polyline points="15,18 18,21 18,27 22,30"/>
    <polyline points="33,18 30,21 30,27 26,30"/>
    <polyline points="24,30 24,36"/>
    <!-- Corner circuit pads -->
    <circle cx="7" cy="12" r="1.5" fill="url(#brand)" stroke="none"/>
    <circle cx="41" cy="12" r="1.5" fill="url(#brand)" stroke="none"/>
    <circle cx="24" cy="3" r="1.5" fill="url(#brand)" stroke="none"/>
    <circle cx="41" cy="33" r="1.5" fill="url(#brand)" stroke="none"/>
    <circle cx="24" cy="45" r="1.5" fill="url(#brand)" stroke="none"/>
    <circle cx="7" cy="33" r="1.5" fill="url(#brand)" stroke="none"/>
  </g>

  <!-- Terminal prompt >_  (the hacker mark) -->
  <text x="24" y="30" text-anchor="middle" font-family="'Courier New','Source Code Pro',monospace" font-size="18" font-weight="900" fill="url(#brand)" filter="url(#glow)" letter-spacing="-1">≥_</text>
</svg>
